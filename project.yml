name: GhostCursor
options:
  bundleIdPrefix: sa.ni
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  GhostCursorKit:
    path: Core
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.4

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: M8A3G95883
      OTHER_CODE_SIGN_FLAGS: "--timestamp"

targets:
  GhostCursor:
    type: application
    platform: macOS
    sources:
      - path: GhostCursor
    dependencies:
      - package: GhostCursorKit
        product: GhostCursorKit
      - package: Sparkle
    info:
      path: GhostCursor/Info.plist
      properties:
        CFBundleName: GhostCursor
        CFBundleDisplayName: GhostCursor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 National Idea LLC"
        SUFeedURL: https://ghostcursor.ni.sa/appcast.xml
        SUPublicEDKey: gEWu/GIBD8BWgt86K7EeXG03pwwzqWmbmG+eVyusEnM=
        SUEnableAutomaticChecks: false
        SUAllowsAutomaticUpdates: false
        SUVerifyUpdateBeforeExtraction: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sa.ni.GhostCursor
        GENERATE_INFOPLIST_FILE: NO
