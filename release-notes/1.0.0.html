<h2>GhostCursor 1.0.0</h2>
<p>First public release.</p>
<ul>
  <li>Idle auto-hide with an instant reveal on mouse movement.</li>
  <li>A global shortcut that toggles auto-hide from anywhere.</li>
  <li>Launch at login, and a menu bar icon that shows the current state.</li>
  <li>No permissions, no telemetry, no data collected.</li>
</ul>
